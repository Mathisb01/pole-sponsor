<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<base target="_blank">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: sticky header + tab bar, one column of panels. DA de la plaquette : rouge pompéien, or, laurier, marbre clair. */
:root{
  --bg:#F7F6F4; --surface:#FFFFFF; --sunk:#EFEBE8; --ink:#2A1714; --muted:#73625E; --line:#E5DCD8;
  --gold:#A67C1E; --brand:#87100C;
  --green:#4A7C3F; --blue:#2F5A8C; --wine:#87100C; --teal:#2E7D73; --orange:#B5531F; --violet:#6B2D6B; --amber:#A57A12; --red:#C4321F; --grey:#7D706B;
  --f-display:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#16100F; --surface:#201817; --sunk:#1B1413; --ink:#F2E9E6; --muted:#B3A29D; --line:#3A2C29; --gold:#DDB75A; --brand:#E8766C;
  --green:#8CBF7E; --blue:#8FB4E6; --wine:#E8766C; --teal:#6FC9BC; --orange:#F0A06E; --violet:#D08CD0; --amber:#E6BE5A; --red:#FF8A73; --grey:#B3A6A1; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16100F; --surface:#201817; --sunk:#1B1413; --ink:#F2E9E6; --muted:#B3A29D; --line:#3A2C29; --gold:#DDB75A; --brand:#E8766C;
  --green:#8CBF7E; --blue:#8FB4E6; --wine:#E8766C; --teal:#6FC9BC; --orange:#F0A06E; --violet:#D08CD0; --amber:#E6BE5A; --red:#FF8A73; --grey:#B3A6A1; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:2px solid var(--brand)}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{font-family:var(--f-display);font-weight:700;letter-spacing:.04em;font-size:21px;color:var(--brand);text-transform:uppercase;display:flex;align-items:center;gap:10px;line-height:1.15}
.brand small{font-family:var(--f-body);font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.logo{width:44px;height:44px;flex:none}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px}
nav::-webkit-scrollbar{display:none}
nav a{flex:none;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px;padding:7px 12px;border-radius:999px}
nav a:hover{color:var(--ink);background:var(--sunk)}
nav a[aria-current="page"]{background:color-mix(in srgb,var(--pc) 18%,var(--surface));color:var(--pc)}
main{padding-block:22px 60px;display:grid;gap:18px}
h1{font-family:var(--f-display);font-size:clamp(28px,4.5vw,38px);font-weight:700;margin:0;letter-spacing:.01em;text-wrap:balance;color:var(--brand);text-transform:uppercase;line-height:1.05}
h2{font-size:17px;margin:0;font-weight:700;text-wrap:balance;display:flex;align-items:center;gap:8px}
h2::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c,var(--gold));flex:none}
h3{font-size:15px;margin:0;font-weight:700}
p{margin:0}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--c,var(--gold))}
.panel{align-content:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:14px;min-width:0}
.panel.tint{background:color-mix(in srgb,var(--c) 7%,var(--surface));border-color:color-mix(in srgb,var(--c) 30%,var(--line))}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button,.btn{font:inherit;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
button:hover,.btn:hover{border-color:var(--c,var(--green))}
button.primary{background:var(--c,var(--green));border-color:var(--c,var(--green));color:var(--surface)}
button.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:5px 8px}
button.mini{padding:3px 9px;font-size:13px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
label{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;align-items:end}
.inline{display:flex;gap:8px;flex-wrap:wrap}
.inline>input{flex:2 1 160px;width:auto}.inline>select{flex:1 1 110px;width:auto}.inline>button{flex:none}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap;color:var(--c,var(--muted));background:color-mix(in srgb,var(--c,var(--muted)) 15%,var(--surface))}
.list{display:grid;gap:8px}
.item{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:6px;background:var(--surface);min-width:0}
.item.late{border-left:3px solid var(--red)}
.item.today{border-left:3px solid var(--amber)}
.task{display:flex;gap:10px;align-items:flex-start}
.task input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--green)}
.task.done .t{text-decoration:line-through;color:var(--muted)}
.bar{height:8px;background:var(--sunk);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--green));border-radius:999px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{border-radius:8px;padding:12px;display:grid;gap:2px;background:color-mix(in srgb,var(--c) 12%,var(--surface));min-width:0}
.tile span{font-size:12px;font-weight:600;color:var(--muted)}
.tile b{font-family:var(--f-mono);font-size:26px;font-weight:500;color:var(--c);font-variant-numeric:tabular-nums;line-height:1.2}
.tile .row{gap:4px}
.who{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.who button{flex-direction:column;align-items:flex-start;padding:16px;gap:4px;text-align:left;border-radius:var(--r);background:color-mix(in srgb,var(--c) 8%,var(--surface))}
.who button strong{font-size:18px}
.banner{border-radius:var(--r);padding:16px 18px;background:var(--brand);color:var(--surface);display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner strong{font-family:var(--f-display);font-size:clamp(20px,3.5vw,26px);letter-spacing:.02em}
.banner button{border-color:var(--surface);background:transparent;color:var(--surface)}
.banner button.on{background:var(--surface);color:var(--brand)}
.offer summary{display:flex;justify-content:space-between;align-items:center;gap:8px;list-style:none}
.offer summary::-webkit-details-marker{display:none}
.offer dl{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;margin:10px 0 0;font-size:14px}
.offer dt{font-weight:700;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
.offer dd{margin:0;white-space:pre-wrap;min-width:0;overflow-wrap:anywhere}
@media (max-width:480px){.offer dl{grid-template-columns:1fr}}
.avatar{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;font-weight:700;font-size:13px;flex:none;color:var(--c);background:color-mix(in srgb,var(--c) 20%,var(--surface))}
.chip{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px;cursor:pointer;border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 3px;background:var(--surface);color:var(--ink)}
.notice{border-radius:8px;padding:10px 12px;font-size:14px;background:color-mix(in srgb,var(--amber) 14%,var(--surface));border:1px solid var(--line)}
.tpl{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:14px;max-height:440px;overflow:auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button[aria-pressed="true"]{background:color-mix(in srgb,var(--c,var(--ink)) 16%,var(--surface));color:var(--c,var(--ink));border-color:var(--c,var(--ink))}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.tablewrap{overflow-x:auto}
ul.clean{margin:0;padding-left:18px;display:grid;gap:5px}
details{border-top:1px solid var(--line);padding-top:8px}
details summary{cursor:pointer;font-weight:700;list-style-position:inside}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-weight:600;font-size:14px;z-index:20}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.ws{display:grid;grid-template-columns:minmax(180px,240px) 1fr;gap:14px;min-width:0}
@media (max-width:640px){.ws{grid-template-columns:1fr}}
.ws-list{align-content:start;max-height:60vh;overflow:auto}
.ws-item{flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;background:transparent}
.ws-item.on{background:color-mix(in srgb,var(--c) 12%,var(--surface));border-color:var(--c)}
.ws-ed{display:grid;gap:8px;min-width:0;align-content:start}
.ws-title{font-family:var(--f-display);font-size:24px;font-weight:700;border:none;background:transparent;padding:4px 0;color:var(--ink)}
.ws-body{min-height:55vh;font-size:15px;line-height:1.6;background:var(--surface)}
.avwrap{position:relative;display:inline-flex;flex:none}
.live{position:absolute;right:-2px;bottom:-2px;width:11px;height:11px;border-radius:50%;background:#2FA84F;border:2px solid var(--surface)}
.onl{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.onl b{width:8px;height:8px;border-radius:50%;background:var(--c)}
.bgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px}
.bcell{font-size:12px;color:var(--c);gap:2px}
.bcell select{padding:5px 6px;font-size:13px;border-color:color-mix(in srgb,var(--c) 45%,var(--line));color:var(--c);font-weight:600}
.chipt{font-size:12px;padding:3px 9px;border-radius:999px;color:var(--muted)}
.chipt.deja{border:1px dashed color-mix(in srgb,var(--gold) 60%,var(--line));color:var(--gold);display:inline-flex;align-items:center}
.chipt.on{background:color-mix(in srgb,var(--amber) 18%,var(--surface));color:var(--amber);border-color:var(--amber)}
.dot{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;font-size:11px;font-weight:700;color:var(--surface);background:var(--c);opacity:.95}
.alist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px;max-height:420px;overflow:auto;padding:2px}
.arow{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font-size:14px;font-weight:500;cursor:pointer}
.arow.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,var(--surface))}
.arow input{width:18px;height:18px;flex:none;accent-color:var(--c)}
.big{font-family:var(--f-mono);font-size:44px;font-weight:500;color:var(--c);line-height:1}
</style>
</head>
